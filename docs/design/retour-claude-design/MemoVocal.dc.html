<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;align-items:flex-start;gap:8px">
<sc-for list="{{ chips }}" as="c" hint-placeholder-count="0">
<div style="display:flex;align-items:center;min-height:44px;border-radius:22px;background:var(--surface-2);color:var(--text)">
<button aria-label="{{ c.aria }}" onClick="{{ c.toggle }}" style="width:44px;height:44px;border:none;background:none;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="{{ c.icon }}"></path></svg></button>
<span style="font-size:15px;font-variant-numeric:tabular-nums">Mémo vocal · {{ c.time }}</span>
<button aria-label="Supprimer ce mémo" onClick="{{ c.del }}" style="width:44px;height:44px;border:none;background:none;color:var(--text-2);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M6 6l12 12 M18 6L6 18"></path></svg></button>
</div>
</sc-for>
<sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}">
<button onClick="{{ start }}" style="min-height:44px;display:flex;align-items:center;gap:8px;padding:0 18px 0 14px;border-radius:22px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:17px;cursor:pointer;font-family:inherit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M3 12h1.5 M7 9v6 M10.5 5.5v13 M14 8.5v7 M17.5 10.5v3 M20.5 12h.5"></path></svg>Mémo vocal</button>
</sc-if>
<sc-if value="{{ rec }}">
<div style="display:flex;align-items:center;gap:14px;min-height:44px;width:100%">
<button onClick="{{ stop }}" style="min-height:44px;display:flex;align-items:center;gap:8px;padding:0 16px 0 14px;border-radius:8px;border:none;background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:600;cursor:pointer;font-family:inherit"><svg width="16" height="16" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"></rect></svg>Arrêter</button>
<span style="font-size:17px;font-variant-numeric:tabular-nums;min-width:40px">{{ time }}</span>
<div aria-hidden="true" style="display:flex;align-items:center;gap:3px;height:28px;flex:1;overflow:hidden"><sc-for list="{{ bars }}" as="b"><span style="{{ b }}"></span></sc-for></div>
</div>
</sc-if>
<sc-if value="{{ err }}"><div style="font-size:15px;line-height:1.35;color:var(--text-2);text-wrap:pretty">{{ errText }}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:358,&quot;height&quot;:120},&quot;memos&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{id:string,dur:number}[]&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ok&quot;,&quot;denied&quot;,&quot;unavail&quot;],&quot;default&quot;:&quot;ok&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;demo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;rec&quot;,&quot;denied&quot;,&quot;unavail&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ctx&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;onAdd&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(m)=&gt;void&quot;},&quot;onDelete&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id)=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { rec: false, sec: 0, t: 0, err: null, local: [], playing: null, pos: 0, frozen: false };
  componentDidMount() {
    const d = this.props.demo;
    this.rm = typeof matchMedia !== 'undefined' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (d === 'rec') this.setState({ rec: true, sec: 12, frozen: true, t: 3 });
    if (d === 'denied' || d === 'unavail') this.setState({ err: d });
    this.vis = () => { if (document.hidden) this.stop(); };
    document.addEventListener('visibilitychange', this.vis);
  }
  componentWillUnmount() {
    document.removeEventListener('visibilitychange', this.vis);
    if (this.state.rec && !this.state.frozen) this.save(Math.max(1, this.state.sec), this.props);
    clearInterval(this.iv); clearInterval(this.wv); clearInterval(this.pv);
  }
  componentDidUpdate(pp) { if (pp.ctx !== this.props.ctx && this.state.rec && !this.state.frozen) { this.save(Math.max(1, this.state.sec), pp); this.reset(); } }
  start() {
    const m = this.props.mode;
    if (m === 'denied' || m === 'unavail') { this.setState({ err: m }); return; }
    this.setState({ rec: true, sec: 0, err: null, frozen: false });
    this.iv = setInterval(() => this.setState(s => { const sec = s.sec + 1; if (sec >= 300) setTimeout(() => this.stop()); return { sec }; }), 1000);
    if (!this.rm) this.wv = setInterval(() => this.setState(s => ({ t: s.t + 1 })), 110);
  }
  stop() {
    if (!this.state.rec) return;
    if (this.state.frozen) { this.setState({ rec: false, frozen: false }); return; }
    this.save(Math.max(1, this.state.sec), this.props); this.reset();
  }
  reset() { clearInterval(this.iv); clearInterval(this.wv); this.setState({ rec: false, sec: 0 }); }
  save(sec, p) { const m = { id: 'm' + Date.now() + Math.floor(Math.random() * 999), dur: sec }; if (p.onAdd) p.onAdd(m); else this.setState(s => ({ local: [...s.local, m] })); }
  list() { return this.props.onAdd ? (this.props.memos || []) : [...(this.props.memos || []), ...this.state.local]; }
  del(id) { if (this.state.playing === id) this.stopPlay(); if (this.props.onDelete) this.props.onDelete(id); else this.setState(s => ({ local: s.local.filter(m => m.id !== id) })); }
  play(m) {
    if (this.state.playing === m.id) { this.stopPlay(); return; }
    clearInterval(this.pv); this.setState({ playing: m.id, pos: 0 });
    this.pv = setInterval(() => this.setState(s => { const pos = s.pos + 1; if (pos >= m.dur) { clearInterval(this.pv); return { playing: null, pos: 0 }; } return { pos }; }), 1000);
  }
  stopPlay() { clearInterval(this.pv); this.setState({ playing: null, pos: 0 }); }
  renderVals() {
    const f = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    const S = this.state, t = S.t;
    const bars = Array.from({ length: 26 }, (_, i) => {
      const h = 5 + Math.abs(Math.sin(t * 0.55 + i * 0.75)) * 17 * (0.55 + 0.45 * Math.abs(Math.sin(i * 1.7 + t * 0.13)));
      return { width: 3, height: Math.round(h), borderRadius: 2, background: 'var(--accent)', flex: 'none' };
    });
    const chips = this.list().map(m => {
      const pl = S.playing === m.id;
      return { aria: pl ? 'Pause' : 'Lire le mémo', icon: pl ? 'M8 5v14 M16 5v14' : 'M8 5.5v13l10-6.5z', time: pl ? f(S.pos) + ' / ' + f(m.dur) : f(m.dur), toggle: () => this.play(m), del: () => this.del(m.id) };
    });
    return {
      chips, idle: !S.rec, rec: S.rec, time: f(S.sec), bars,
      err: !!S.err && !S.rec,
      errText: S.err === 'denied' ? "Micro non autorisé. Tu peux l'activer dans les réglages de l'iPhone." : "Le micro ne répond pas pour l'instant. Tu peux écrire, ou dicter avec le clavier.",
      start: () => this.start(), stop: () => this.stop()
    };
  }
}
</script>
</body>
</html>
